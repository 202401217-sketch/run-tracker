<link rel="icon" href="icon.svg" type="image/svg+xml">
<style id="css">
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#eef0f4;--mute:#8b91a0;--accent:#3ddc97;--gold:#ffc857;--warn:#ff6b6b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 14px 40px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.money{font-size:30px;font-weight:700;letter-spacing:-.5px}
.money small{font-size:15px;color:var(--mute);font-weight:500}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#11141a;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--mute)}
.next{border-color:var(--accent)}
.next .lbl{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.next .big{font-size:22px;font-weight:700;margin:2px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--mute)}
.dot.done{background:var(--accent);color:#06281a}
.dot.today{outline:2px solid var(--gold);outline-offset:2px}
.dot.missed{background:#3a2226;color:var(--warn)}
.info{flex:1;min-width:0}
.info .t{font-weight:600}
.info .d{font-size:12px;color:var(--mute)}
.earn{font-size:13px;text-align:right;min-width:62px}
.earn.five{color:var(--gold);font-weight:700}
input[type=number],input[type=date]{background:#0c0e12;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 8px;font-size:15px;width:76px}
input[type=date]{width:auto}
button{background:var(--accent);color:#06281a;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.5}
.tag{font-size:10px;background:var(--gold);color:#2a1f00;border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:700;vertical-align:middle}
h2{font-size:14px;color:var(--mute);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.6px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222733;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.extra{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const GOAL = 27500;
const PLAN = [
 ["2026-11-09",2.0],["2026-11-11",2.3],["2026-11-13",2.6],["2026-11-15",2.9],
 ["2026-11-17",3.2],["2026-11-19",3.5],["2026-11-21",3.8],["2026-11-23",4.1],
 ["2026-11-25",4.4],["2026-11-27",4.7],["2026-11-29",5.0,"Race day"],["2026-12-01",5.0],
 ["2026-12-03",5.0],["2026-12-05",5.2],["2026-12-07",5.2],["2026-12-09",5.4],
 ["2026-12-11",5.4],["2026-12-13",5.4]
];
let state = {logs:{},extras:[]};

// ₹200/km, but ₹500/km for any run of 5 km or more in one go
const pay = km => km >= 5 ? km*500 : km*200;
const rs = n => "₹" + Math.round(n).toLocaleString("en-IN");
const fmtDate = s => new Date(s+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function totals(){
  let km=0, money=0, runs=0, fives=0;
  const all = Object.values(state.logs).concat(state.extras.map(e=>e.km));
  all.forEach(k=>{ if(k>0){ km+=k; money+=pay(k); runs++; if(k>=5) fives++; } });
  return {km,money,runs,fives};
}

function render(){
  const t = totals(), today = todayStr();
  const pct = Math.min(100, t.money/GOAL*100);
  const nextIdx = PLAN.findIndex(([d]) => !(state.logs[d]>0) && d >= today);
  const left = Math.max(0, GOAL - t.money);
  let h = `<h1>🏃 5K Run Tracker</h1><div class="sub">9 Nov – 13 Dec · every alternate day · goal ${rs(GOAL)}</div>`;
  h += `<div class="card"><div class="money">${rs(t.money)} <small>/ ${rs(GOAL)}</small></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="note">${left>0 ? rs(left)+" to go" : "🎉 Goal reached!"}</div>
    <div class="stats"><div class="stat"><b>${t.km.toFixed(1)}</b><span>km run</span></div>
    <div class="stat"><b>${t.runs}</b><span>runs done</span></div>
    <div class="stat"><b>${t.fives}</b><span>5 km+ runs</span></div></div></div>`;
  if(nextIdx>=0){
    const [d,km,tag] = PLAN[nextIdx];
    const isToday = d===today;
    h += `<div class="card next"><div class="lbl">${isToday?"Today's run":"Next run"}</div>
      <div class="big">${km.toFixed(1)} km ${tag?`<span class="tag">${tag}</span>`:""}</div>
      <div class="d" style="color:var(--mute);font-size:13px">${fmtDate(d)} · 6 PM · earns ${rs(pay(km))}${km>=5?" (₹500/km)":""}</div>
      ${isToday?`<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="number" step="0.1" min="0" id="quick" value="${km}"> km <button onclick="logRun('${d}',document.getElementById('quick').value)">Log run</button></div>`:""}
    </div>`;
  }
  h += `<h2>Plan</h2><div class="card">`;
  PLAN.forEach(([d,km,tag],i)=>{
    const done = state.logs[d]>0, actual = state.logs[d];
    const past = d < today, isToday = d===today;
    const cls = done?"done":(past?"missed":"");
    h += `<div class="row"><div class="dot ${cls} ${isToday?"today":""}">${done?"✓":(i+1)}</div>
      <div class="info"><div class="t">${done?actual.toFixed(1)+" km":"Target "+km.toFixed(1)+" km"}${tag?`<span class="tag">${tag}</span>`:""}</div>
      <div class="d">${fmtDate(d)}${done && actual<km?` · target ${km.toFixed(1)}`:""}${!done&&past?" · missed":""}</div></div>`;
    if(done){
      h += `<div class="earn ${actual>=5?"five":""}">+${rs(pay(actual))}</div><button class="ghost" onclick="logRun('${d}',0)">Undo</button>`;
    } else if(d <= today){
      h += `<input type="number" step="0.1" min="0" id="in-${d}" value="${km}"><button onclick="logRun('${d}',document.getElementById('in-${d}').value)">Done</button>`;
    } else {
      h += `<div class="earn ${km>=5?"five":""}">${rs(pay(km))}</div>`;
    }
    h += `</div>`;
  });
  h += `</div>`;
  h += `<h2>Extra runs</h2><div class="card"><div class="extra">
    <input type="date" id="exd" value="${today}"><input type="number" step="0.1" min="0" id="exk" placeholder="km">
    <button onclick="addExtra()">Add</button></div>`;
  state.extras.slice().sort((a,b)=>a.d<b.d?1:-1).forEach(e=>{
    h += `<div class="row"><div class="dot done">+</div><div class="info"><div class="t">${e.km.toFixed(1)} km</div><div class="d">${fmtDate(e.d)}</div></div>
      <div class="earn ${e.km>=5?"five":""}">+${rs(pay(e.km))}</div><button class="ghost" onclick="delExtra('${e.id}')">✕</button></div>`;
  });
  h += `</div><div class="note">Pay rule: ₹200 per km. A run of 5 km or more in one go pays ₹500 per km for the whole run.
    Saved on this device.</div>
  <div class="extra" style="margin-top:10px"><button class="ghost" onclick="exportData()">⬇ Backup</button>
  <label class="ghost" style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--mute);font-size:14px;cursor:pointer">⬆ Restore<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>`;
  document.getElementById("app").innerHTML = h;
}

function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }

function save(msg){
  try { localStorage.setItem("runTrackerState", JSON.stringify(state)); } catch(e){ toast("Couldn't save on this device"); }
  render();
  if(msg) toast(msg);
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="run-tracker-backup-"+todayStr()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  f.text().then(t=>{ const s=JSON.parse(t); if(!s.logs||!s.extras) throw 0; state=s; save("Backup restored"); })
   .catch(()=>toast("That isn't a tracker backup file"));
  input.value="";
}

function logRun(d, val){
  const km = Math.round(parseFloat(val)*10)/10;
  if(!(km>=0)) return toast("Enter the km you ran");
  if(km===0){ delete state.logs[d]; save("Run removed"); return; }
  state.logs[d] = km;
  save(`Logged ${km.toFixed(1)} km · +${rs(pay(km))}`);
}
function addExtra(){
  const d=document.getElementById("exd").value, km=Math.round(parseFloat(document.getElementById("exk").value)*10)/10;
  if(!d || !(km>0)) return toast("Pick a date and enter km");
  state.extras.push({id:Date.now().toString(36), d, km});
  save(`Extra ${km.toFixed(1)} km · +${rs(pay(km))}`);
}
function delExtra(id){ state.extras = state.extras.filter(e=>e.id!==id); save("Removed"); }

try { const ls = localStorage.getItem("runTrackerState"); if(ls) state = JSON.parse(ls); } catch(e){}
if(!state || !state.logs) state = {logs:{},extras:[]};
render();
// re-render at midnight / when reopened so "today" stays right
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render(); });
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
